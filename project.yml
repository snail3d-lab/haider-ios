name: Haider
options:
  bundleIdPrefix: com.snail3d
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyXIBs: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "9V8U7PCW58"

targets:
  Haider:
    type: application
    platform: iOS
    sources:
      - path: Haider
    settings:
      base:
        PRODUCT_NAME: Haider
        PRODUCT_BUNDLE_IDENTIFIER: com.snail3d.haider
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Haider
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Haider saves the finished clip to your photo library."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon